<div class=" d-flex flex-column align-items-center justify-content-center p-4 position-relative main-wrapper">
  
  <!-- Language Switcher -->
  <button (click)="gheras.toggleLang()" 
          class="btn btn-outline-light opacity-50 position-absolute top-0 end-0 m-3 rounded-pill px-4 btn-lang">
    {{ gheras.lang() === 'ar' ? 'English' : 'عربي' }}
  </button>

  <!-- Header -->
  <div class="text-center mb-5">
    <h1 class="display-4 fw-bold text-warning mb-1">{{ gheras.currentContent().title }}</h1>
    <p class="text-secondary small tracking-widest opacity-75">{{ gheras.currentContent().subtitle }}</p>
  </div>

  <!-- Progress Circle -->
  <div class="position-relative d-flex align-items-center justify-content-center mb-5 progress-container">
    <svg width="240" height="240" viewBox="0 0 250 250" class="rotate-svg">
      <circle cx="125" cy="125" r="95" stroke="rgba(255,255,255,0.05)" stroke-width="8" fill="transparent" />
      <circle cx="125" cy="125" r="95" stroke="#a855f7" stroke-width="10" fill="transparent" 
              stroke-linecap="round"
              [style.strokeDasharray]="597"
              [style.strokeDashoffset]="597 - (gheras.count() / 24) * 597"
              class="transition-progress" />
      <defs>
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fbbf24" />
          <stop offset="100%" stop-color="#f59e0b" />
        </linearGradient>
      </defs>
    </svg>
    <div class="position-absolute text-center">
      <h2 class="display-3 fw-light mb-0">{{ gheras.count() }}</h2>
      <p class="small text-secondary text-uppercase tracking-wider">/ 24</p>
    </div>
  </div>

  <!-- Zekr Display (The Card) -->
  <div class="text-center mx-auto mb-5 zekr-card shadow-lg" style="min-height: 140px; width: 100%; max-width: 500px;">
    @if(!gheras.isFinished()){
      <p class="h2 fw-light lh-lg animate-fade">
        {{ gheras.currentContent().currentZekr }}
      </p>
    }

    @if(gheras.isFinished()){
      <div class="animate-bounce">
        <p class="text-warning fw-bold h3 mb-3">{{ gheras.currentContent().done }}</p>
        <button (click)="gheras.reset()" class="btn btn-link text-secondary">{{ gheras.currentContent().reset }}</button>
      </div>
    }
  </div>

  <!-- Main Button -->
  <button (click)="gheras.increment()" 
          [disabled]="gheras.isFinished()"
          class="btn-main-circle" >
      <div class="inner-circle" [class]="gheras.isFinished()? 'disabled' : ''">
         <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" fill="white" class="bi bi-stars" viewBox="0 0 16 16">
            <path d="M7.657 6.247c.11-.33.576-.33.686 0l.645 1.937a2.89 2.89 0 0 0 1.829 1.828l1.936.645c.33.11.33.576 0 .686l-1.937.645a2.89 2.89 0 0 0-1.828 1.829l-.645 1.936c-.11.33-.576.33-.686 0l-.645-1.937a2.89 2.89 0 0 0-1.828-1.828l-1.937-.645c-.33-.11-.33-.576 0-.686l1.937-.645a2.89 2.89 0 0 0 1.828-1.829l.645-1.937zM1.494 3.155c.05-.15.272-.15.322 0l.352 1.055a1.49 1.49 0 0 0 .946.946l1.055.352c.15.05.15.272 0 .322l-1.055.352a1.49 1.49 0 0 0-.946.946l-.352 1.055c-.05.15-.272.15-.322 0l-.352-1.055a1.49 1.49 0 0 0-.946-.946l-1.055-.352c-.15-.05-.15-.272 0-.322l1.055-.352a1.49 1.49 0 0 0 .946-.946l.352-1.055z"/>
         </svg>
      </div>
  </button>

  <!-- Footer -->
  <footer class="mt-auto py-4  small opacity-50 fw-light">
    {{ gheras.currentContent().footer }}
  </footer>
</div>
